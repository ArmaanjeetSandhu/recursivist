[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "recursivist"
version = "3.0.0"
description = "A command-line tool for visualizing directory structures"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Armaanjeet Singh Sandhu", email = "armaanjeetsandhu430@gmail.com"},
]
keywords = [
    "directory",
    "file-tree",
    "visualization",
    "cli",
    "filesystem",
    "explorer",
    "directory-structure"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "rich>=13.0",
    "typer>=0.19",
    "shellingham>=1.3",
    "pathspec>=0.12",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
"Repository" = "https://github.com/ArmaanjeetSandhu/recursivist"
"Documentation" = "https://armaanjeetsandhu.github.io/recursivist"
"Issues" = "https://github.com/ArmaanjeetSandhu/recursivist/issues"

[project.scripts]
recursivist = "recursivist.cli:main"
rcv = "recursivist.cli:main"

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "hypothesis",
    "docutils",
]
lint = ["ruff"]
typecheck = [
    {include-group = "test"},
    "mypy",
    "pyright",
    "nox",
    "nox-uv",
]
docs = [
    "zensical",
    "mkdocstrings",
    "mkdocstrings-python",
    "pymdown-extensions",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "typecheck"},
]

[tool.hatch.build.targets.wheel]
packages = ["recursivist"]

[tool.hatch.build.targets.sdist]
include = ["/recursivist", "/tests", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers --strict-config --cov=recursivist --cov-report=term-missing"
xfail_strict = true
markers = [
    "integration: end-to-end tests that build real directory trees and invoke the CLI",
    "property: Hypothesis property-based tests",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "YTT",     # flake8-2020
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "ISC",     # flake8-implicit-str-concat
    "G",       # flake8-logging-format
    "LOG",     # flake8-logging
    "PIE",     # flake8-pie
    "T20",     # flake8-print
    "PT",      # flake8-pytest-style
    "RET",     # flake8-return
    "SIM",     # flake8-simplify
    "TID",     # flake8-tidy-imports
    "TC",      # flake8-type-checking
    "UP",      # pyupgrade
    "FURB",    # refurb
    "PERF",    # perflint
    "RUF",     # Ruff-specific rules
    "TRY401",  # tryceratops-verbose-log-message
]

[tool.ruff.lint.isort]
known-first-party = ["recursivist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
