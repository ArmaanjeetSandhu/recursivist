[project]
site_name = "Recursivist"
site_description = "A beautiful directory structure visualization tool"
site_author = "Armaanjeet Singh Sandhu"
site_url = "https://armaanjeetsandhu.github.io/recursivist/"
repo_url = "https://github.com/ArmaanjeetSandhu/recursivist"
repo_name = "ArmaanjeetSandhu/recursivist"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2025 Armaanjeet Singh Sandhu"

extra_css = ["assets/css/extra.css"]
extra_javascript = ["assets/js/extra.js"]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quick Start" = "getting-started/quick-start.md" },
  ] },
  { "User Guide" = [
    { "Basic Usage" = "user-guide/basic-usage.md" },
    { "Visualization" = "user-guide/visualization.md" },
    { "Sorting and Statistics" = "user-guide/sorting-and-statistics.md" },
    { "Pattern Filtering" = "user-guide/pattern-filtering.md" },
    { "Export" = "user-guide/export.md" },
    { "Compare" = "user-guide/compare.md" },
    { "GitHub Repositories" = "user-guide/github-repositories.md" },
    { "Configuration" = "user-guide/configuration.md" },
    { "Shell Completion" = "user-guide/shell-completion.md" },
  ] },
  { "Recipes" = [
    { "Overview" = "recipes/index.md" },
    { "Filtering by Project Type" = "recipes/filtering.md" },
    { "Keeping Structure Docs Up to Date" = "recipes/documentation.md" },
    { "Analyzing a Codebase with JSON" = "recipes/json.md" },
    { "Comparing Versions, Branches, and Builds" = "recipes/comparisons.md" },
    { "Scripting and Python" = "recipes/scripting.md" },
  ] },
  { "Reference" = [
    { "CLI Reference" = "reference/cli-reference.md" },
    { "Export Formats" = "reference/export-formats.md" },
    { "Pattern Matching" = "reference/pattern-matching.md" },
    { "Python API" = [
      { "Overview" = "reference/api-reference.md" },
      { "Scanning and Filtering" = "reference/api/scanning.md" },
      { "Sorting and Metrics" = "reference/api/display.md" },
      { "Rendering" = "reference/api/rendering.md" },
      { "Exporters" = "reference/api/exporters.md" },
      { "Git, GitHub, and Configuration" = "reference/api/integrations.md" },
    ] },
  ] },
  { "Contributing" = [
    { "How to Contribute" = "contributing/index.md" },
    { "Development Guide" = "contributing/development.md" },
    { "Testing Guide" = "contributing/testing.md" },
  ] },
]

[project.theme]
logo = "assets/images/logo-black.svg"
favicon = "assets/images/logo-white.svg"
features = [
  "navigation.sections",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.path",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
  "content.action.edit",
  "content.tabs.link",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

# Pages that moved in the documentation restructure keep their old URLs.
[project.plugins.redirects.redirect_maps]
"examples/basic.md" = "recipes/index.md"
"examples/filtering.md" = "recipes/filtering.md"
"examples/export.md" = "recipes/documentation.md"
"examples/compare.md" = "recipes/comparisons.md"
"examples/advanced.md" = "recipes/index.md"
"advanced/integration.md" = "recipes/index.md"
"advanced/development.md" = "contributing/development.md"
"advanced/testing.md" = "contributing/testing.md"
"sitemap.md" = "index.md"

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
options.show_source = true
options.show_root_heading = true
options.show_symbol_type_heading = true
options.separate_signature = true
options.show_signature_annotations = true
options.signature_crossrefs = true
options.members_order = "source"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ArmaanjeetSandhu/recursivist"
name = "Recursivist on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/recursivist/"
name = "Recursivist on PyPI"
